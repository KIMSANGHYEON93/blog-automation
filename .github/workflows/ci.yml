name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Lint
        run: ruff check src/ tests/

      - name: Run Mypy Typecheck
        run: mypy src/ --ignore-missing-imports

      - name: Validate DDD Layer Rules
        run: make validate-ddd

  test-unit:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Unit Tests (Python 3.9)
        if: matrix.python-version == '3.9'
        run: python -m pytest tests/unit/ -v --tb=short

      - name: Run Unit Tests with Coverage (Python 3.11)
        if: matrix.python-version == '3.11'
        run: python -m pytest tests/unit/ -v --tb=short --cov=src/domain --cov=src/application --cov-report=term-missing --cov-fail-under=80

  test-n8n:
    name: n8n Node & Workflow Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run n8n Code Node Tests
        run: node --test "n8n/code_nodes/naver/tests/*.test.js" "n8n/code_nodes/tests/*.test.js"

      - name: Validate Generated Workflows
        run: python scripts/build_naver_workflow.py --check

  ci-gate:
    name: Quality Gate Passed
    needs: [lint-and-typecheck, test-unit, test-n8n]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check Status of All Jobs
        run: |
          if [ "${{ needs.lint-and-typecheck.result }}" != "success" ] || \
             [ "${{ needs.test-unit.result }}" != "success" ] || \
             [ "${{ needs.test-n8n.result }}" != "success" ]; then
            echo "❌ CI Quality Gate Failed"
            exit 1
          fi
          echo "✅ All CI Quality Gates Passed Successfully"
