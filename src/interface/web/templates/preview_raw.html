<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>미리보기 · {{ post.keyword }}</title>
  <style>
    body { margin: 0; background: #fff; color: #333; font: 16px/1.8 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 16px; }
    .note { font-size: 13px; color: #86868b; }
    img { max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <main>
    <p class="note">{{ post.row_index }}행 미리보기 · 블로그에 올라갈 본문 그대로입니다. '관련 글'과 내부 링크는 발행할 때 붙습니다. 돌아가려면 브라우저의 뒤로 가기를 쓰세요.</p>
    <h1>{{ post.title }}</h1>
    {{ body_html|safe }}
  </main>
</body>
</html>
