services:
  n8n:
    image: n8nio/n8n:1.123.22
    restart: always
    ports:
      - "5678:5678"
    environment:
      # 로그인은 n8n 내부 사용자 관리(소유자 계정)를 쓴다.
      # N8N_BASIC_AUTH_* 는 n8n 1.0에서 제거돼 동작하지 않으므로 두지 않는다.
      # 비밀번호 분실 시: docker exec <컨테이너> n8n user-management:reset-password --email <이메일>
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Seoul
      - TZ=Asia/Seoul
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - NODE_FUNCTION_ALLOW_BUILTIN=zlib
      - NODE_OPTIONS=--max-old-space-size=4096
    volumes:
      - n8n_data:/home/node/.n8n
    env_file:
      - .env

volumes:
  n8n_data:
