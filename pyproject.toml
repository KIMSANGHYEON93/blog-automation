[project]
name = "blog-automation"
version = "2.3.0"
description = "B2B IT Blog Automation - DDD 4-Layer Architecture"
requires-python = ">=3.9"
dependencies = [
    "gspread>=6.0",
    "google-auth>=2.0",
    "google-api-python-client>=2.0",
    "seleniumbase>=4.25",
    "python-dotenv>=1.0",
    "markdown>=3.5",
    "Pygments>=2.17",
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "bleach>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "e2e: marks tests as end-to-end tests",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N802"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "src.infrastructure.browser.tistory_editor"
warn_return_any = false
